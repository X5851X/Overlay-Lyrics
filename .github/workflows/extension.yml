name: extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "packages/core/**"
      - "docs/contoh.lrc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - "packages/core/**"
      - "docs/contoh.lrc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/extension.yml"

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @lyrics-overlay/extension
      - run: npm run build -w @lyrics-overlay/extension
